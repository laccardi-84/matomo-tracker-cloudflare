# Suivi des assistants IA pour Achrodeco
routes = [
  { pattern = "www.achrodeco.com/*", zone_name = "achrodeco.com" }
]
name = "matomo-ai-tracking"
main = "dist/index.js"
compatibility_date = "2024-12-08"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true
invocation_logs = true

[build]
command = "npm run build"

[dev]
port = 8787
local_protocol = "https"

[vars]
MATOMO_URL = "https://achro.innocraft.cloud"
MATOMO_SITE_ID = "6"
MATOMO_TIMEOUT_MS = "5000"
LOG_LEVEL = "warn"
USER_AGENT_ALLOWLIST_REGEX = ""
DOCUMENT_REGEX = ""
